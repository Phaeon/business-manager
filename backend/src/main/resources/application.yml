spring:
  application:
    name: business-manager

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:business_manager}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-min-32-chars-long}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}      # 15 min
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 jours
  # Création du compte administrateur au premier démarrage (base vide)
  bootstrap-admin: true
  admin:
    email: ${ADMIN_EMAIL:admin@demo.com}
    password: ${ADMIN_PASSWORD:Admin1234!}
  # Données de démonstration (clients, devis, factures, projets...)
  seed-demo: ${APP_SEED_DEMO:false}
  storage:
    path: ${STORAGE_PATH:./uploads}
  invoice:
    payment-terms-days: 30
  company:
    name: ${COMPANY_NAME:Business Manager SAS}
    address: ${COMPANY_ADDRESS:12 rue de l'Exemple, 49000 Angers}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.businessmanager: DEBUG
